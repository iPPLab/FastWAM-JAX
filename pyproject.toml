[project]
name = "fastwam-jax"
version = "0.0.0"
description = "JAX implementation of the Fast-WAM uncond model and trainer"
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "LICENSES/*.txt", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = [
    "jax>=0.9.0",
    "flax>=0.12.6",
    "optax>=0.2.5",
    "orbax-checkpoint>=0.11.33",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "gcsfs>=2024.6.0",
    "simplejpeg>=1.7",
    "pillow>=10.0",
]

[project.optional-dependencies]
tpu = ["jax[tpu]>=0.9.0"]
cuda = ["jax[cuda12]>=0.11.0"]
convert = [
    "torch>=2.4",
    "safetensors>=0.4.5",
    "huggingface-hub>=0.25.0",
    "diffusers>=0.33.1",
    "transformers>=4.49.0",
]
dataset = ["av>=14", "pyarrow>=18"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastwam_jax"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
